<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вітаємо, донечко!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="media-wrapper">
            <div id="imageDisplay" class="media-box">
                <img src="media/girl.png" alt="Даринка" class="layer-girl">
                <img src="media/queen.png" alt="Шахова королева" class="layer-queen">
            </div>
            <div id="videoDisplay" class="media-box hidden">
                <video id="giftVideo" src="media/Gift_video.mp4" playsinline></video>
            </div>
        </header>

        <main>
            <div class="motto-section">
                <p class="motto-text">Live with purpose. Love without fear. Play your own game.</p>
            </div>

            <div class="audio-player">
                <div class="audio-controls">
                    <button id="playPauseBtn" class="control-btn" title="Відтворення / Пауза">
                        <svg id="playIcon" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
                        <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    </button>
                    <button id="stopBtn" class="control-btn" title="Зупинити">
                        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M6 6h12v12H6z"/></svg>
                    </button>
                    <button id="loopBtn" class="control-btn" title="Повтор">
                        <svg id="loopInactiveIcon" viewBox="0 0 24 24" width="24" height="24">
                            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M19 12a7 7 0 0 1-11.3 5.4M5 12a7 7 0 0 1 11.3-5.4"/>
                            <path fill="currentColor" d="M19 8V5l4 4-4 4V8zM5 16v3l-4-4 4-4v3z"/>
                        </svg>
                        <svg id="loopActiveIcon" class="hidden" viewBox="0 0 24 24" width="24" height="24">
                            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M19 12a7 7 0 0 1-11.3 5.4M5 12a7 7 0 0 1 11.3-5.4"/>
                            <path fill="currentColor" d="M19 8V5l4 4-4 4V8zM5 16v3l-4-4 4-4v3z"/>
                            <text x="12" y="15" font-family="'Outfit', sans-serif" font-size="8" font-weight="900" text-anchor="middle" fill="currentColor">П</text>
                        </svg>
                    </button>
                </div>
                <div id="progressContainer" class="progress-container">
                    <div id="progress" class="progress-bar"></div>
                </div>
            </div>

            <div class="birthday-section">
                <div id="birthdayContent" class="birthday-text-container">
                    <div class="loading-text">Завантаження щирих слів...</div>
                </div>
            </div>
        </main>

        <footer class="footer">
            &copy; <span id="year"></span> Mykhailo Anisimov
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
